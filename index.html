<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamInvest - Sean Morgan TikTok Earn</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head><body style="background:#f5f7fb;padding-bottom:90px;font-family:sans-serif">
<div style="background:linear-gradient(to right,#000,#ff0050);color:white;padding:16px">
<h1 style="font-weight:bold;font-size:20px">CamInvest Hub 🇨🇲</h1>
<p style="font-size:13px">Sean Morgan @ambokiapromise792 - Watch & Earn</p>
<div style="background:rgba(255,255,255,0.2);border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between">
<div><p style="font-size:11px">Balance</p><b id="bal">XAF 105</b></div>
<div><p style="font-size:11px">Done</p><b id="done">0/10</b></div>
</div></div>

<div style="margin:16px;background:white;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05)">
<p style="font-weight:bold">🎬 Featured: Sean Morgan TikTok</p>
<a href="https://vm.tiktok.com/ZS9BbLLrWKNaH-MGPcs/" target="_blank" style="font-size:12px;color:#ff0050">https://vm.tiktok.com/ZS9BbLLrWKNaH-MGPcs/</a>
</div>

<div style="padding:0 16px"><h2 style="font-weight:bold;margin-bottom:12px">📺 Daily Tasks - Earn 10.5 XAF each</h2><div id="list"></div></div>

<button id="wdBtn" style="position:fixed;bottom:20px;right:16px;left:16px;background:#16a34a;color:white;padding:14px;border-radius:30px;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,0.3);z-index:50">💸 Withdraw to MTN MoMo - Min 100F</button>

<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;padding:16px">
<div style="background:white;border-radius:16px;padding:20px;width:100%;max-width:380px">
<h2 style="font-weight:bold;font-size:18px">Withdraw</h2>
<input id="num" placeholder="MoMo Number e.g. 678657567" style="width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:12px">
<select id="type" style="width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:8px"><option>MTN Mobile Money</option><option>Orange Money</option></select>
<input id="amt" type="number" placeholder="Amount e.g. 100" style="width:100%;border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:8px">
<button id="sendWd" style="background:#16a34a;color:white;width:100%;padding:12px;border-radius:10px;margin-top:12px;font-weight:bold">✅ Send Withdraw Request</button>
<button onclick="document.getElementById('modal').style.display='none'" style="background:#eee;width:100%;padding:10px;border-radius:10px;margin-top:8px">Cancel</button>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore,collection,addDoc} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBhMWKR7UBD4zaXCCn08WLeOrD2yvWlicY",authDomain:"caminvest-hub-14129.firebaseapp.com",projectId:"caminvest-hub-14129",storageBucket:"caminvest-hub-14129.firebasestorage.app",messagingSenderId:"992533738944",appId:"1:992533738944:web:9776d1a82b840f33378425"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const tiktok="https://vm.tiktok.com/ZS9BbLLrWKNaH-MGPcs/";
const list=document.getElementById('list');let c=0;
for(let i=1;i<=10;i++){let d=document.createElement('div');d.style.cssText="background:white;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05)";d.innerHTML=`<div style="display:flex;justify-content:space-between"><b>Task ${i}: Watch Sean</b><span style="background:#dcfce7;color:green;padding:2px 8px;border-radius:10px;font-size:12px">+10.5 XAF</span></div><div style="background:black;border-radius:12px;margin-top:8px;padding:24px;text-align:center;color:white"><p>🎥 TikTok Video ${i}</p><a href="${tiktok}" target="_blank" style="background:#ff0050;color:white;padding:8px 16px;border-radius:8px;display:inline-block;margin-top:8px;text-decoration:none;font-size:13px">▶️ Open TikTok Video</a></div><button class="claimBtn" style="background:#ff0050;color:white;width:100%;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;border:none">⏱️ Watch 30s & Claim 10.5 XAF</button>`;list.appendChild(d);}
list.addEventListener('click',e=>{if(!e.target.classList.contains('claimBtn'))return;let btn=e.target;let s=30;btn.disabled=true;let iv=setInterval(()=>{s--;btn.innerText=`⏳ Watching... ${s}s`;if(s<=0){clearInterval(iv);btn.innerText="✅ Claimed +10.5 XAF";btn.style.background="#16a34a";c++;document.getElementById('done').innerText=c+"/10";let b=parseFloat(document.getElementById('bal').innerText.replace(/[^0-9.]/g,''));document.getElementById('bal').innerText="XAF "+(b+10.5);if(c==10)alert("🎉 You earned 105 XAF today!");}},1000);window.open(tiktok,"_blank");});
document.getElementById('wdBtn').onclick=()=>{document.getElementById('modal').style.display='flex'};
document.getElementById('sendWd').onclick=async()=>{let num=document.getElementById('num').value;let amt=document.getElementById('amt').value;let type=document.getElementById('type').value;if(!num||!amt){alert("Enter number & amount");return;}if(amt<100){alert("Min 100 XAF");return;}try{await addDoc(collection(db,"withdrawals"),{phone:num,amount:Number(amt),method:type,status:"pending",createdAt:new Date()});alert(`✅ Request Sent!\n${type}\n${num}\n${amt} XAF\nCheck admin.html`);document.getElementById('modal').style.display='none';}catch(e){alert("Go to Firebase Console -> Firestore -> Create Database -> Test mode! Error: "+e.message);}};
</script></body></html>
