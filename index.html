<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamInvest Hub | Invest With Knowledge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;line-height:1.6;color:#222}
header{background:#0b5d45;color:white;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:800}
.logo span{color:#ffd166}
nav a{color:white;text-decoration:none;margin-left:18px;font-weight:600}
.hero{padding:80px 7%;background:linear-gradient(120deg,#0b5d45,#12a87a);color:white;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.hero h1{font-size:42px;line-height:1.1;margin-bottom:15px}
.hero p{max-width:600px;opacity:.95;margin-bottom:22px;font-size:18px}
.btn{display:inline-block;padding:14px 26px;border-radius:30px;text-decoration:none;font-weight:700;margin-right:10px}
.primary{background:white;color:#0b5d45}
.secondary{border:2px solid white;color:white}
.card-box{background:white;padding:20px;border-radius:16px;color:#222;box-shadow:0 10px 30px rgba(0,0,0,.15)}
section{padding:60px 7%}
h2{text-align:center;margin-bottom:35px;font-size:32px;color:#0b5d45}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.07);border:1px solid #eee}
.card h3{color:#0b5d45;margin-bottom:10px}
.price{font-size:28px;font-weight:800;margin:10px 0}
.badge{background:#e6f6f0;color:#0b5d45;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}
footer{background:#062e22;color:#c7e8dd;padding:40px 7%;text-align:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>
</head>
<body>

<div class="logo">CamInvest <span>Hub</span></div>
