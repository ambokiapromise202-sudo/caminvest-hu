<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamInvest Hub — Smart Financial Platform</title>

<style>
:root{
  --navy:#071a33;
  --navy2:#0c2a4d;
  --green:#16a66a;
  --green2:#0e8755;
  --white:#ffffff;
  --bg:#f4f7fb;
  --text:#152235;
  --muted:#708096;
  --border:#e4eaf1;
  --danger:#df4b55;
  --warning:#e5a523;
  --shadow:0 10px 30px rgba(7,26,51,.08);
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

header{
  height:72px;
  background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:800;
  color:var(--navy);
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--green),var(--navy2));
  color:white;
  display:grid;
  place-items:center;
  font-weight:900;
}

.nav{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav a{
  color:#53647a;
  font-size:14px;
  font-weight:600;
}

.nav a:hover{
  color:var(--green);
}

.btn{
  border:0;
  padding:12px 19px;
  border-radius:12px;
  font-weight:700;
  transition:.2s;
}

.btn-primary{
  background:var(--green);
  color:white;
}

.btn-primary:hover{
  background:var(--green2);
  transform:translateY(-1px);
}

.btn-outline{
  background:white;
  border:1px solid var(--border);
  color:var(--navy);
}

.btn-danger{
  background:#fff0f1;
  color:var(--danger);
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#06172d,#0b3158);
  color:white;
  padding:80px 6%;
  min-height:570px;
  display:flex;
  align-items:center;
}

.hero-content{
  max-width:650px;
}

.badge{
  display:inline-block;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  padding:8px 13px;
  border-radius:50px;
  font-size:12px;
  margin-bottom:22px;
}

.hero h1{
  font-size:58px;
  line-height:1.05;
  margin-bottom:22px;
  letter-spacing:-2px;
}

.hero p{
  color:#c7d5e6;
  font-size:17px;
  line-height:1.7;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.hero .btn-outline{
  background:transparent;
  border-color:#53708e;
  color:white;
}

/* SECTIONS */

section{
  padding:70px 6%;
}

.section-title{
  text-align:center;
  max-width:650px;
  margin:0 auto 40px;
}

.section-title h2{
  font-size:34px;
  margin-bottom:10px;
}

.section-title p{
  color:var(--muted);
  line-height:1.6;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:25px;
  box-shadow:var(--shadow);
}

.feature-icon{
  width:50px;
  height:50px;
  background:#e9f8f1;
  color:var(--green);
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:23px;
  margin-bottom:17px;
}

.card h3{
  margin-bottom:10px;
}

.card p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

/* PLANS */

.plan{
  position:relative;
}

.plan.popular{
  border:2px solid var(--green);
}

.popular-label{
  position:absolute;
  right:18px;
  top:18px;
  background:var(--green);
  color:white;
  padding:5px 9px;
  border-radius:30px;
  font-size:10px;
  font-weight:800;
}

.plan-name{
  font-size:20px;
  font-weight:800;
}

.plan-amount{
  font-size:30px;
  font-weight:900;
  margin:15px 0;
}

.plan ul{
  list-style:none;
  margin:20px 0;
}

.plan li{
  padding:8px 0;
  color:#607086;
  font-size:14px;
}

.plan li::before{
  content:"✓";
  color:var(--green);
  font-weight:bold;
  margin-right:8px;
}

/* FOOTER */

footer{
  background:#06172d;
  color:#b7c6d8;
  padding:50px 6%;
}

.footer-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:30px;
}

footer h3{
  color:white;
  margin-bottom:15px;
}

footer p,footer a{
